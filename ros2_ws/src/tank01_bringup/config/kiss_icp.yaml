kiss_icp_node:
  ros__parameters:
    base_frame: base_link
    lidar_odom_frame: odom_lidar
    publish_odom_tf: false
    invert_odom_tf: false
    max_range: 60.0
    min_range: 1.2                # ignore the vehicle itself / mower
    deskew: true
    voxel_size: 0.5
    max_points_per_voxel: 20
