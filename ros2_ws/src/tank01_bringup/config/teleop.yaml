# Joystick / gamepad teleoperation (dead-man button required)
joy_node:
  ros__parameters:
    deadzone: 0.08
    autorepeat_rate: 20.0

teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 4             # LB = dead-man switch
    enable_turbo_button: 5       # RB
    axis_linear:  {x: 1}
    scale_linear: {x: 0.6}
    scale_linear_turbo: {x: 1.4}
    axis_angular: {yaw: 3}
    scale_angular: {yaw: 0.8}
    scale_angular_turbo: {yaw: 1.0}
