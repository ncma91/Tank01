# robot_localization – dual EKF + navsat_transform, see docs/07_lokalisierung_navigation.md
# Sensor config vectors: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]

ekf_local:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: false              # slopes! keep 3D so roll/pitch are estimated
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom/wheel
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,     # vx, vy (vy=0 constraint for tracks)
                   false, false, false,     # yaw rate from tracks is unreliable (slip)
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    odom1: /kiss_icp/odometry
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  true,  true,
                   false, false, true,
                   false, false, false]
    odom1_differential: false
    odom1_queue_size: 5

    imu0: /imu/data
    imu0_config: [false, false, false,
                  true,  true,  false,      # absolute roll/pitch, no magnetometer yaw
                  false, false, false,
                  true,  true,  true,
                  true,  false, false]
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 20

    process_noise_covariance: [0.05, 0.05, 0.06, 0.03, 0.03, 0.06, 0.025, 0.025, 0.04, 0.01, 0.01, 0.02, 0.01, 0.01, 0.015]

ekf_global:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.3
    two_d_mode: false
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    odom0: /odom/wheel
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10

    odom1: /odometry/gnss          # from navsat_transform
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_pose_rejection_threshold: 5.0   # Mahalanobis gate against GNSS multipath jumps

    imu0: /imu/data
    imu0_config: [false, false, false,
                  true,  true,  false,
                  false, false, false,
                  true,  true,  true,
                  true,  false, false]
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 20

    imu1: /gnss/heading            # absolute yaw from the dual-antenna moving base
    imu1_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu1_queue_size: 5
    imu1_pose_rejection_threshold: 3.0

    process_noise_covariance: [0.05, 0.05, 0.06, 0.03, 0.03, 0.06, 0.025, 0.025, 0.04, 0.01, 0.01, 0.02, 0.01, 0.01, 0.015]

navsat_transform:
  ros__parameters:
    frequency: 10.0
    delay: 0.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0                # heading input is already ENU (0 = east)
    zero_altitude: true
    broadcast_cartesian_transform: true
    publish_filtered_gps: true
    use_odometry_yaw: true         # yaw comes from ekf_global (fed by dual-antenna heading)
    wait_for_datum: true
    # Fixed site datum [lat, lon, heading]. Must match the GeoJSON "datum" property!
    datum: [47.26010, 11.39210, 0.0]
