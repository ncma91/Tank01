# Unicore UM982 (e.g. gnss.store ELT0211, USB-C) – tank01_gnss/um982_node
um982_node:
  ros__parameters:
    port: /dev/tank01/gnss
    baudrate: 115200
    frame_id: gnss_front
    heading_frame_id: base_link
    mount_offset_deg: 0.0          # ANT1 rear, ANT2 front (baseline along +x)
    min_baseline_m: 0.5
    verify_checksums: true
    verify_unicore_crc: false
    # Sent once at start-up. Add 'SAVECONFIG' after the first successful test.
    config_commands: ['GPGGA 0.1', 'GPGST 0.1', 'UNIHEADINGA 0.1']
