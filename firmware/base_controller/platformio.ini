; Tank01 base controller – Teensy 4.1
; Build & flash:  pio run -t upload   |   Serial monitor: pio device monitor

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DUSB_SERIAL
lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git
    paulstoffregen/Encoder@^1.4.4
